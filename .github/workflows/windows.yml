name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build Windows app
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Windows native input and toolbar regression tests
        shell: pwsh
        run: dotnet run --project tests/ScreenInk.WindowsTests/ScreenInk.WindowsTests.csproj -c Release
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenInk-ui-evidence
          path: artifacts/ui
      - name: Package x64 smoke artifact
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenInk-win-x64-unsigned
          path: |
            artifacts/ScreenInk-0.2.1-win-x64.zip
            artifacts/ScreenInk-0.2.1-win-x64-offline.zip
